name: Trigger Deploy

on:
  push:
    branches:
      - main
      - feature/swift-rewrite

jobs:
  build_image:
    name: Build and Push Swift Image
    runs-on: ubuntu-latest
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write
    env:
      IMAGE: ghcr.io/josephduffy/josephduffy.co.uk-swift
    steps:
      - uses: actions/checkout@v7

      # Enable building arm64 images on x86_64 runners.
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile.vapor
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=swift
          cache-to: type=gha,mode=max,scope=swift
          provenance: mode=max
          sbom: true

      - name: Attest image
        uses: actions/attest@v4
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

  deploy_oracle:
    name: Deploy Oracle ARM image
    needs: [build_image]
    permissions:
      attestations: read
      contents: read
      id-token: write
    uses: JosephDuffy/webserver-deploy/.github/workflows/deploy-image.yml@master
    with:
      target: josephduffy-co-uk-swift
      digest: ${{ needs.build_image.outputs.digest }}
    secrets:
      TS_CLIENT_ID: ${{ secrets.TS_CLIENT_ID }}
      TS_AUDIENCE: ${{ secrets.TS_AUDIENCE }}
