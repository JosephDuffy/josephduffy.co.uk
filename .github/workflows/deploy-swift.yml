name: Trigger Deploy

on:
  push:
    branches:
      - main
      - feature/swift-rewrite

jobs:
  build_amd64_image:
    name: Build and Push AMD64 Swift Image
    runs-on: ubuntu-24.04
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write
    env:
      IMAGE: ghcr.io/josephduffy/josephduffy.co.uk-swift
    steps:
      - uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile.vapor
          platforms: linux/amd64
          outputs: |
            type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=swift-amd64
          cache-to: type=gha,mode=max,scope=swift-amd64
          provenance: mode=max
          sbom: true

      - name: Attest image
        uses: actions/attest@v4
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

  build_arm64_image:
    name: Build and Push ARM64 Swift Image
    runs-on: ubuntu-24.04-arm
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write
    env:
      IMAGE: ghcr.io/josephduffy/josephduffy.co.uk-swift
    steps:
      - uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile.vapor
          platforms: linux/arm64
          outputs: |
            type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=swift-arm64
          cache-to: type=gha,mode=max,scope=swift-arm64
          provenance: mode=max
          sbom: true

      - name: Attest image
        uses: actions/attest@v4
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

  publish_manifest:
    name: Publish Multi-Architecture Swift Image
    runs-on: ubuntu-24.04
    needs: [build_amd64_image, build_arm64_image]
    outputs:
      digest: ${{ steps.manifest.outputs.digest }}
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write
    env:
      IMAGE: ghcr.io/josephduffy/josephduffy.co.uk-swift
      AMD64_DIGEST: ${{ needs.build_amd64_image.outputs.digest }}
      ARM64_DIGEST: ${{ needs.build_arm64_image.outputs.digest }}
    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create and push manifest
        id: manifest
        run: |
          docker buildx imagetools create \
            --tag "${IMAGE}:latest" \
            --tag "${IMAGE}:sha-${GITHUB_SHA}" \
            --metadata-file manifest-metadata.json \
            "${IMAGE}@${AMD64_DIGEST}" \
            "${IMAGE}@${ARM64_DIGEST}"
          manifest_digest=$(jq -r '."containerimage.descriptor".digest' manifest-metadata.json)
          echo "digest=${manifest_digest}" >> "$GITHUB_OUTPUT"

      - name: Attest image
        uses: actions/attest@v4
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.manifest.outputs.digest }}
          push-to-registry: true

  deploy_oracle:
    name: Deploy Oracle ARM image
    needs: [build_arm64_image]
    permissions:
      attestations: read
      contents: read
      id-token: write
    uses: JosephDuffy/webserver-deploy/.github/workflows/deploy-image.yml@master
    with:
      target: josephduffy-co-uk-swift
      digest: ${{ needs.build_arm64_image.outputs.digest }}
    secrets:
      TS_CLIENT_ID: ${{ secrets.TS_CLIENT_ID }}
      TS_AUDIENCE: ${{ secrets.TS_AUDIENCE }}
