name: Trigger Deploy

on:
  push:
    branches:
      - main

jobs:
  build_image:
    name: Build and Push Image
    runs-on: ubuntu-latest
    env:
      IMAGE: ghcr.io/josephduffy/josephduffy.co.uk
    steps:
      - uses: actions/checkout@v7

      # Support for building multi-arch images on non-native platforms (e.g. building arm64 images on x86_64 runners).
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          build-args: |
            BUILD_DATE=${{ github.event.head_commit.timestamp }}
            GIT_COMMIT=${{ github.sha }}
            WEBSITE_URL=https://josephduffy.co.uk/
            HCAPTCHA_SITE_KEY=3549990c-5b31-4c18-84b6-e7f57fcde61b
          secrets: |
            GITHUB_ACCESS_TOKEN=${{ secrets.GITHUB_TOKEN }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: mode=max
          sbom: true

      - name: Attest image
        uses: actions/attest@v4
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

  trigger_webhook:
    # if: ${{ false }} # Webhooks seem to be delivered automatically again.
    name: Trigger Webhook
    runs-on: ubuntu-latest
    needs: [build_image]
    steps:
      - uses: actions/checkout@v7

      - name: Trigger Webhook
        run: ./scripts/trigger-update-webhook.sh "josephduffy.co.uk" "$WEBHOOK_SECRET" "$WEBHOOK_URL"
        env:
          WEBHOOK_SECRET: ${{ secrets.WEBHOOK_SECRET }}
          WEBHOOK_URL: ${{ secrets.WEBHOOK_URL }}
